[workspace]
resolver = "2"
members = ["projects/*"]
default-members = [
    "projects/ys-types",
]
exclude = [
    "projects/.DS_Store",
]

[workspace.dependencies]
ys-types = { path = "projects/ys-types", version = "0.0.1" }
ys-storage = { path = "projects/ys-storage", version = "0.1.0" }
ys-gateway = { path = "projects/ys-gateway", version = "0.0.0" }
ys-protocol = { path = "projects/ys-protocol", version = "0.0.0" }
ys-driver = { path = "projects/ys-driver", version = "0.0.0" }
ys-client = { path = "projects/ys-client", version = "0.0.0" }
ys-server = { path = "projects/ys-server", version = "0.0.0" }
ys-cli = { path = "projects/ys-cli", version = "0.0.1" }
ys-ignore = { path = "projects/ys-ignore", version = "0.0.1" }
ys-driver-git = { path = "projects/ys-driver-git", version = "0.0.0" }
ys-driver-p4 = { path = "projects/ys-driver-p4", version = "0.0.0" }
ys-driver-svn = { path = "projects/ys-driver-svn", version = "0.0.0" }
ys-gateway-git = { path = "projects/ys-gateway-git", version = "0.0.0" }
ys-gateway-p4 = { path = "projects/ys-gateway-p4", version = "0.0.0" }
ys-gateway-svn = { path = "projects/ys-gateway-svn", version = "0.0.0" }

# External dependencies
dashmap = "5.5.3"
blake3 = { version = "1.3.3", features = ["std"] }
tracing = "0.1.40"
serde = { version = "1.0.160", features = ["derive"] }
serde_json = "1.0.115"
tokio = { version = "1.37.0" }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1.5"
futures = "0.3"
clap = { version = "4.2.5", features = ["derive"] }
clap_builder = "4.5.2"
tokio-test = "0.4.4"
tempfile = "3.10.1"

[profile.release]
lto = true
panic = "abort"
